name: PHP Checks

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Static Analysis)
        run: ./vendor/bin/phpstan analyse

      - name: Run Pest (Tests)
        run: ./vendor/bin/pest

      # check:deploy asserts the production image's own configuration. The
      # application suite runs under a different ini and never executes the
      # deploy scripts, so nothing else checks what the container ships.
      - name: Run deployment contract checks
        run: |
          bash tests/scripts/php-ini.sh
          bash tests/scripts/nginx-config.sh
          bash tests/scripts/post-deployment.sh
