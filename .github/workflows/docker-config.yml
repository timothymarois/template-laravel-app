name: Docker Config Checks

# Proves the shipped Docker configuration against the BUILT IMAGE, not against
# the source files. A config file that reads correctly but is copied to the
# wrong path, included in the wrong context, or shadowed by a later directive
# passes every source-level check and still breaks production.
on:
  pull_request:
    branches: [main, production]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'tests/docker/**'
      - '.github/workflows/docker-config.yml'
      # Markdown under docker/ documents the setup; it cannot alter the image.
      # Without this exclusion a README edit triggers two full image builds.
      - '!docker/**.md'
  push:
    branches: [main, production]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'tests/docker/**'
      - '.github/workflows/docker-config.yml'
      # Markdown under docker/ documents the setup; it cannot alter the image.
      # Without this exclusion a README edit triggers two full image builds.
      - '!docker/**.md'

# The image build is the most expensive job in the matrix; a superseded run
# must not keep a runner busy while the run that replaced it queues behind it.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  effective-config:
    name: Effective built-image configuration
    runs-on: ubuntu-latest
    # Config-only build: this must stay fast. If it approaches the limit,
    # something has started pulling the application build back in.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ── Image 1: no project files (the default every fork inherits) ────────
      - name: Build image with an empty project directory
        uses: docker/build-push-action@v6
        with:
          context: .
          # runtime-config, not runtime: this job proves the effective web-tier
          # configuration, which verify-*.sh establishes by starting nginx and
          # php-fpm directly, before any application code runs. Targeting the
          # config stage skips composer, pnpm and both Vite builds — the same
          # COPY directives, without a full application build.
          target: runtime-config
          load: true
          tags: template-app:default
          # A fixed scope. type=gha keys its cache per-branch by default, so every
          # branch rebuilt the whole image from cold — which is why this job took
          # 400-635s on every run including main. A shared scope lets a PR branch
          # reuse the layers main already built.
          cache-from: type=gha,scope=docker-config
          cache-to: type=gha,mode=max,scope=docker-config
          # No SLSA attestation: nothing consumes it here, and it adds an export
          # step to a job that only inspects configuration.
          provenance: false

      # ── Image 2: the fixture project files, through the SAME Dockerfile ────
      # Only the three project COPY layers re-run; the app build is cached.
      - name: Install fixture project configuration
        run: |
          cp tests/docker/fixtures/nginx/http/*.conf   docker/project/nginx/http/
          cp tests/docker/fixtures/nginx/server/*.conf docker/project/nginx/server/
          cp tests/docker/fixtures/php/*.ini           docker/project/php/

      - name: Build image with project configuration
        uses: docker/build-push-action@v6
        with:
          context: .
          # runtime-config, not runtime: this job proves the effective web-tier
          # configuration, which verify-*.sh establishes by starting nginx and
          # php-fpm directly, before any application code runs. Targeting the
          # config stage skips composer, pnpm and both Vite builds — the same
          # COPY directives, without a full application build.
          target: runtime-config
          load: true
          tags: template-app:project
          cache-from: type=gha,scope=docker-config
          provenance: false

      - name: Restore a clean tree
        run: git checkout -- docker/project && git clean -fd docker/project

      - name: Verify the default image
        run: bash tests/docker/verify-default.sh template-app:default

      - name: Verify the project-configured image
        run: bash tests/docker/verify-project.sh template-app:project
