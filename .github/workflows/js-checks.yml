name: JavaScript Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JavaScript Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PHP + composer are needed because `pnpm build` runs
      # `php artisan ziggy:generate` (and composer's post-autoload-dump
      # generates the initial `resources/js/ziggy.js` that the Vite bundle
      # imports). Without this, vite build fails on the bundled Ziggy import.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Run ESLint
        run: pnpm lint

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Run Vitest (Tests)
        run: pnpm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      - name: Run Build
        run: pnpm build

      - name: Run SSR Build
        run: pnpm exec vite build --ssr
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
