name: Knowledge Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  doc-lint:
    name: Knowledge Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Teeth-test the linter (valid passes, each mutation fails)
        run: python3 .knowledge/scripts/test_doc_lint.py
      - name: Lint the knowledge docs
        run: python3 .knowledge/scripts/doc-lint .knowledge
