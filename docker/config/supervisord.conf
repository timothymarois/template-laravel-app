; ── Supervisor program definitions: this project's process list ──────────────
; Included by the base /etc/supervisor/supervisord.conf via [include] conf.d/*.conf
; All logs go to stdout/stderr so Coolify captures them in the dashboard.
;
; ONE universal file — enable ONLY the processes this project needs. The docker
; README's "This project's setup" section is the source of truth for which are
; on; keep this file matched to it.
;
;   CORE (always on):  php-fpm · nginx
;   OPTIONAL (delete the block if this project doesn't use it):
;     - inertia-ssr → Inertia SSR apps (built with `pnpm build-ssr`)
;     - horizon     → Redis queue via Horizon  (or use the [program:queue] block)
;     - scheduler   → apps with scheduled tasks (`schedule:work`)
;     - reverb      → Reverb websockets (uncomment the block at the bottom; expose :8080)
;
; A DB-less brochure site keeps just php-fpm + nginx (+ inertia-ssr if it renders
; with SSR) and deletes horizon/scheduler.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; OPTIONAL — Inertia SSR server (Laravel calls it at 127.0.0.1:13714).
; Remove this block for non-SSR apps.
[program:inertia-ssr]
command=php /var/www/html/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; OPTIONAL — Redis queue workers via Horizon.
; Replace with [program:queue] (bottom) if the app doesn't use Horizon.
[program:horizon]
command=php /var/www/html/artisan horizon
user=www-data
autostart=true
autorestart=true
priority=40
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; CORE — Laravel scheduler (long-running)
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── OPTIONAL alternatives (uncomment as needed) ──────────────────────────────
;
; Plain queue worker (use INSTEAD of horizon if not running Horizon):
; [program:queue]
; command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
; user=www-data
; autostart=true
; autorestart=true
; priority=40
; stopwaitsecs=3600
; stopasgroup=true
; killasgroup=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
;
; Laravel Reverb websocket server (expose its port as a second Coolify domain/port):
; [program:reverb]
; command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
; user=www-data
; autostart=true
; autorestart=true
; priority=35
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
