server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Deliberately low, and raised per route rather than here. nginx buffers a
    # request body to temp disk BEFORE PHP is reached, so a large ceiling on the
    # server block hands every endpoint — unauthenticated ones included — that
    # much temp disk and inbound bandwidth per concurrent request. A route that
    # needs more gets it in its own location: see docker/project/README.md.
    client_max_body_size 25M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Laravel Reverb WebSocket (public, client-facing). Upgrades the Pusher-protocol
    # /app/{appKey} connection to the Reverb server on 127.0.0.1:8080. The ^~ /app/
    # matcher catches the WebSocket path ONLY — never /apps/{id}/events (the
    # server-side events API), which must stay off the public domain. No-op for
    # forks that don't run Reverb (nothing listens on 8080).
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Fork-owned location blocks (docker/project/nginx/server/ -> /etc/nginx/snippets).
    # Included BEFORE `location ~ \.php$` so their regex locations are matched first.
    # A wildcard include matching no files is a no-op, which is the shipped state.
    include /etc/nginx/snippets/*.conf;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65;
    }

    # Deny dotfiles except ACME well-known challenges
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
