# ── Project configuration: http context ──────────────────────────────────────
# Anything a project drops in `docker/project/nginx/http/*.conf`. This file is
# included from nginx's http context, so directives here are http-context ones:
# `limit_req_zone` / `limit_conn_zone` (shared-memory zones cannot be declared
# in a server or location block), `map`, `geo`.
#
# A wildcard include that matches nothing is not an error, so a project that
# ships no files changes nothing. MANAGED CORE — projects add files, not lines.
include /etc/nginx/project/http/*.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Laravel Reverb WebSocket (public, client-facing). Upgrades the Pusher-protocol
    # /app/{appKey} connection to the Reverb server on 127.0.0.1:8080. The ^~ /app/
    # matcher catches the WebSocket path ONLY — never /apps/{id}/events (the
    # server-side events API), which must stay off the public domain. No-op for
    # forks that don't run Reverb (nothing listens on 8080).
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # Deny dotfiles except ACME well-known challenges
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Project configuration: server context ────────────────────────────────
    # Anything a project drops in `docker/project/nginx/server/*.conf` — most
    # often a `location` that needs its own `client_max_body_size`, which the
    # server-wide 25M above deliberately does not grant.
    #
    # LAST in the block on purpose. nginx tries regex locations in configuration
    # order, so everything above wins a tie: a project regex can neither shadow
    # the PHP handler nor punch a hole in the dotfile deny above. Use
    # `location = /exact/uri` or a regex that cannot match those, and end the
    # block with `include /etc/nginx/snippets/laravel-front-controller.conf;`
    # — see docker/README.md → "Project configuration".
    #
    # MANAGED CORE — projects add files under docker/project/, never lines here.
    include /etc/nginx/project/server/*.conf;
}
