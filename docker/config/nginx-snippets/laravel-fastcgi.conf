# Hands a real .php file to PHP-FPM. This is the body of the template's
# `location ~ \.php$` block, factored out so a project location can reuse the
# managed-core wiring instead of copying it (and drifting from it).
#
# SCRIPT_FILENAME is derived from the REQUEST URI, so this snippet is only
# correct for a URI that names an actual PHP file. To route a non-.php URI
# through Laravel's front controller, include `laravel-front-controller.conf`
# instead.
fastcgi_pass 127.0.0.1:9000;
fastcgi_index index.php;
fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
include fastcgi_params;
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 65;
