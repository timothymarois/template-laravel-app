# Hands ANY URI to Laravel's front controller, whatever the request path looks
# like. A project location that needs its own `client_max_body_size` must
# terminate in FastCGI itself — `try_files $uri /index.php` issues an internal
# redirect, nginx re-runs location matching, and the elevated ceiling is lost to
# `location ~ \.php$` before the body is ever read.
#
# `include fastcgi_params` comes FIRST on purpose: the stock file defines
# SCRIPT_NAME from the request URI, and the overrides below must be the last
# value sent for each name.
include fastcgi_params;
fastcgi_pass 127.0.0.1:9000;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param PATH_INFO       "";
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 65;
