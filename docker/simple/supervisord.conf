; SIMPLE variant process list — DB-less site (web + SSR only).
; To use: copy this over docker/supervisord.conf and copy
; docker/simple/entrypoint.sh over docker/entrypoint.sh, then delete docker/simple/.
; Logs → stdout/stderr for Coolify. No horizon/scheduler (no queue, no DB).
; Blade-only site? Remove the inertia-ssr block too.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Inertia SSR server — Laravel calls it at 127.0.0.1:13714. Falls back to
; client-side rendering if unavailable, so it never blocks the site.
[program:inertia-ssr]
command=php /var/www/html/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
