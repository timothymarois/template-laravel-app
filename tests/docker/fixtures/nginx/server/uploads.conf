# Fixture: server-context project configuration — one named URI with its own
# body ceiling, its own pre-body rate/concurrency guard, and a front-controller
# handoff. Everything the template promises a project can do, in one file.
location = /__template-upload-fixture {
    client_max_body_size 60M;

    # Applied in nginx's preaccess phase — BEFORE the request body is read, so a
    # refused request never reaches client_body_temp_path.
    limit_conn tpl_upload_conn 2;
    limit_req  zone=tpl_upload_req burst=2 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    client_body_timeout 120s;

    include /etc/nginx/snippets/laravel-front-controller.conf;
}
